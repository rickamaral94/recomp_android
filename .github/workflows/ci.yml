name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.30.5

jobs:
  host:
    name: Host tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Vulkan headers + lavapipe for the real probe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          RECOMP_EXPECT_VULKAN: '1'
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-37.0" \
            "build-tools;36.0.0" "build-tools;37.0.0"
      - name: Build APK and run JVM tests
        run: ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest
      - name: Check native library
        run: |
          BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p apkx && unzip -q -o "$APK" 'lib/*' -d apkx
          SO=apkx/lib/arm64-v8a/librecompandroid.so
          file "$SO" | grep -q 'ARM aarch64'
          # Every LOAD segment aligned to 16 KB (Android 15+ page size).
          if "$BIN/llvm-readelf" -l "$SO" | awk '$1=="LOAD"{print $NF}' | grep -qv '^0x4000$'; then
            echo "LOAD segment not 16 KB aligned"; exit 1
          fi
          for s in openLog log buildReport; do
            "$BIN/llvm-nm" -D --defined-only "$SO" | grep -q "Java_io_github_rickamaral94_recompandroid_NativeBridge_$s$"
          done
          # The commit baked into the native code is the one being built.
          "$BIN/llvm-strings" "$SO" | grep -qx "$GITHUB_SHA"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: recomp_android-${{ github.sha }}-arm64-v8a
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
